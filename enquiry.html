<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Best Quality Store - Product Enquiry &amp; Order Form</title>
    <meta name="description" content="Complete your product enquiry or order delivery/pickup with Best Quality Store in Polokwane.">

    <!-- Links this HTML page to the external CSS stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ========================= -->
    <!-- HEADER -->
    <!-- ========================= -->

    <header>

        <p>
            <img src="images/Logo.jpg"
                 alt="Best Quality Store Logo"
                 width="120">
        </p>

        <h1>Make an Enquiry</h1>

        <p>
            <em>Complete the Equiry form.</em>
        </p>

    <br>

    <!-- ========================= -->
    <!-- NAVIGATION -->
    <!-- ========================= -->

    <nav>

        <p>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="services.html">Products</a>
            <a href="enquiry.html">Enquiry</a>
            <a href="contact.html">Contact</a>
            <a href="cart.html">🛒Cart (<span id="cart-count">0</span>)</a>
        </p>

    </nav>

    </header>

    <!-- ========================= -->
    <!-- MAIN CONTENT -->
    <!-- ========================= -->

    <main>

        <section>

            <h2>Product Enquiry Form</h2>

            <p>
                Complete the form below and we will contact you.
            </p>

            <hr>

            <form>

                <!-- Enquiry Type -->
                <section>
                    <h3>Enquiry Type</h3>
                    <p>
                        <label for="enquiry-type">What is your enquiry regarding?</label><br>
                        <select id="enquiry-type" name="enquiry_type" style="padding: 10px; width: 100%; border: 2px solid #d8dee9; border-radius: 8px;">
                            <option value="Product / Service Enquiry">Product / Service Enquiry</option>
                            <option value="Sponsorship Opportunity">Sponsorship Opportunity</option>
                            <option value="Volunteer Application">Volunteer Application</option>
                            <option value="Bulk Order & Partnership">Bulk Order &amp; Partnership</option>
                        </select>
                    </p>
                </section>

                <!-- Personal Information -->
                <section>

                    <h3>Send Us an Enquiry</h3>

                    <p>

                        <label for="fullname">
                            Full Name:
                        </label>

                        <br>

                        <input type="text"
                               id="fullname"
                               name="fullname"
                               placeholder="Enter your full name">

                    </p>

                    <p>

                        <label for="email">
                            Email Address:
                        </label>

                        <br>

                        <input type="email"
                               id="email"
                               name="email"
                               placeholder="Enter your email address">

                    </p>

                    <p>

                        <label for="phone">
                            Telephone Number:
                        </label>

                        <br>

                        <input type="tel"
                               id="phone"
                               name="phone"
                               placeholder="Enter your phone number">

                    </p>

                </section>

                <br>

                <!-- Message -->
                <section>

                    <h3>Additional Information</h3>

                    <p>

                        <label for="message">
                            Message:
                        </label>

                        <br>

                        <textarea id="message"
                                  name="message"
                                  rows="5"
                                  cols="30"
                                  placeholder="Enter your message here"></textarea>
                    </p>

                </section>

                <!-- Submit -->
                <p>

                    <button type="submit">
                        Submit Enquiry
                    </button>

                </p>

            </form>

        </section>

    </main>

    <!-- ========================= -->
    <!-- FOOTER -->
    <!-- ========================= -->

    <hr>

    <footer>

    <p>
        <strong>Best Quality Store</strong>
    </p>

    <p>
        &copy; 2023 Best Quality Store.
        All rights reserved.
    </p>

</footer>

<script src="js/script.js"></script>

</body>
</html>
